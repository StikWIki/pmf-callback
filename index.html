<!doctype html>
<!-- TikTok Login Kit redirect page for PickMyFate Stats. Static: it only shows the one-time `code` TikTok sends back so
     the creator can paste it into the local token script. It stores nothing and sends nothing anywhere. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>PickMyFate Sign-in</title>
<style>
  :root { --bg: #0d1017; --card: #171b26; --text: #f2f4f8; --muted: #9aa3b5; --accent: #ffd24a; --err: #ff6b6b; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: var(--card); border-radius: 16px; padding: 24px; max-width: 560px; width: 100%; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  code { display: block; background: #000; color: var(--accent); padding: 12px; border-radius: 8px; word-break: break-all;
         font-size: 14px; margin-bottom: 12px; }
  button { background: var(--accent); color: #0d1017; border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 700;
           font-size: 15px; cursor: pointer; }
  .err { color: var(--err); }
</style>
</head>
<body>
<main class="card">
  <h1 id="title">PickMyFate sign-in</h1>
  <p id="msg">Waiting for TikTok…</p>
  <code id="code" hidden></code>
  <button id="copy" hidden>Copy code</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code"), error = q.get("error"), state = q.get("state");
  const $ = (id) => document.getElementById(id);
  if (code) {
    $("title").textContent = "Signed in with TikTok";
    $("msg").textContent = "Copy this code and paste it into the token script within a few minutes (it expires quickly and works once)."
      + (state ? " State: " + state : "");
    $("code").textContent = code; $("code").hidden = false; $("copy").hidden = false;
    $("copy").onclick = () => navigator.clipboard.writeText(code).then(() => { $("copy").textContent = "Copied"; });
    history.replaceState(null, "", location.pathname); // keep the code out of the address bar and history
  } else if (error) {
    $("title").textContent = "Sign-in failed";
    $("msg").className = "err";
    $("msg").textContent = error + (q.get("error_description") ? ": " + q.get("error_description") : "");
  } else {
    $("msg").textContent = "This page receives the TikTok sign-in for PickMyFate Stats. Nothing to do here on its own.";
  }
</script>
</body>
</html>
